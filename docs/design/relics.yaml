# =============================================================================
# ProjetCactus — Pool d'artefacts (reliques)
# =============================================================================
# Source de vérité design pour les 50 reliques. À éditer à la main pour
# l'équilibrage. Sera converti en .tres (godot/resources/relics/) une fois
# les valeurs validées en playtest.
#
# Schéma (chaque entrée) :
#   id              : snake_case stable, sera l'id côté .tres
#   name            : nom affiché (FR)
#   tier            : common | rare | epic | legendary
#   effect_type     : stat | on_hit | on_kill | on_dash | on_damaged
#                     | on_low_hp | on_revive | on_reload | combo_mod | coop
#   trigger         : passive | on_hit | on_kill | on_dash | on_damaged
#                     | on_low_hp | on_revive | on_reload
#                     (pour effect_type=stat, trigger=passive)
#   magnitude       : map libre de paramètres (dépend du type)
#   description     : phrase courte qui décrit l'effet ressenti
#   flavor          : lore court (optionnel)
#   weapon_filter   : null | pistol | shotgun | rifle | melee
#                     (l'effet ne se déclenche qu'avec ce type d'arme)
#   school_filter   : null | fire | ice | thunder | poison | earth
#                     (l'effet ne s'applique qu'à cette école de magie)
#   drop_pool       : standard | shop_only | boss_only
#   inspiration     : référence design (sera retirée à terme)
#
# Répartition : 18 communs / 15 rares / 12 épiques / 5 légendaires = 50.
# =============================================================================


[package]
name = "cactus_native"
version = "0.1.0"
edition = "2021"
authors = ["ProjetCactus team"]
description = "Native Rust hotspots (combos engine, boss AI, procgen) for ProjetCactus."
license = "Proprietary"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Bindings Rust officiels pour Godot 4.x
# Voir https://godot-rust.github.io/book/
godot = "0.5"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

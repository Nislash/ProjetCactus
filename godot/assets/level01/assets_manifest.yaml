    refine_task_id: "019fde5e-d231-796b-bbe5-993d87ce50a5"    # 10 cr, DA glaciaire

# --- Suivi budget ------------------------------------------------------------
# Renseigné au fil de l'eau. Le solde de départ vient de meshy_check_balance.
budget:
  credits_at_start: 1100
  credits_at_start_date: 2026-08-07
  credits_spent_total: 195
  # 3 cristaux livres a 35 cr (20 generation + 10 refine + 5 remesh)
  # + 3 props generes et textures mais pas encore remeshes/telecharges (30 cr chacun).
  # Budget accorde par l'utilisateur : 300 credits.
  budget_granted: 300

# =============================================================================
# assets_manifest.yaml — Niveau 2 « La Forge de Magma »
# =============================================================================
# Même règle qu'au niveau 1 : tout asset généré présent dans
# godot/assets/level02/ DOIT avoir une entrée ici. Pas d'entrée = pas de merge.
# Schéma et champs : cf godot/assets/level01/assets_manifest.yaml.
#
# CE QUI DIFFÈRE DU NIVEAU 1
#
# Le niveau 1 produisait des MAILLAGES (cristaux, props, habillage du Golem).
# Le niveau 2 ne produit ici que des MATIÈRES, et pour une raison technique :
# le château et le pont sont bâtis en primitives À L'EXÉCUTION, depuis les
# cotes du terrain. Il n'existe donc aucun maillage à envoyer à
# `meshy_retexture`, qui réclame un `input_task_id` Meshy ou une URL publique —
# le pipeline « retexture-first » du projet ne s'applique pas.
#
# La voie retenue : Meshy rend l'ALBÉDO, les cartes normal et rugosité en sont
# dérivées par `godot/tools/build_forge_materials.gd`, et le tout est projeté en
# TRIPLANAIRE, donc sans UV. Cf l'entête de ce script pour le détail.
#
# Docs liées :
#   docs/tech/meshy_setup.md — setup, licence, règles de production
# =============================================================================

schema_version: 1

generator:
  provider: meshy
  account_plan: paid
  mcp_server: "@meshy-ai/meshy-mcp-server"

assets:
  - name: forge-masonry
    path: res://assets/level02/textures/forge_masonry_albedo.png
    type: texture_only
    applies_to:
      - res://assets/level02/materials/forge_masonry.tres
    used_by:
      - res://scripts/world/forge_castle.gd   # murs, tours, terrasse, créneaux
      - res://scripts/world/forge_bridge.gd   # pylônes d'ancrage
    prompt: >-
      Seamless tileable PBR texture, top-down orthographic view, perfectly flat
      even lighting, no cast shadows, no perspective, no vignette. Hand-cut
      basalt block masonry: large irregular near-black volcanic stone blocks,
      deep recessed mortar joints, chipped and fractured edges, fine grey ash
      settled in the recesses, faint warm ember staining deep in the cracks.
      Photoreal game material, fills the entire frame edge to edge, repeating
      pattern.
    meshy_task_id: 019fe35e-71e0-7244-b981-b83b5bcfb139
    meshy_model: nano-banana-pro
    credits_spent: 9
    resolution: 1024x1024
    license: meshy-paid-full-ownership
    generated_on: 2026-08-08
    derived_maps:
      # Dérivées de l'albédo, pas générées : cf build_forge_materials.gd sur ce
      # que vaut — et ne vaut pas — un relief déduit de la luminance.
      - res://assets/level02/textures/forge_masonry_normal.png
      - res://assets/level02/textures/forge_masonry_rough.png

  - name: forge-deck
    path: res://assets/level02/textures/forge_deck_albedo.png
    type: texture_only
    applies_to:
      - res://assets/level02/materials/forge_deck.tres
    used_by:
      - res://scripts/world/forge_bridge.gd   # le tablier, et rien d'autre
    prompt: >-
      Seamless tileable PBR texture, top-down orthographic view, perfectly flat
      even lighting, no cast shadows, no perspective, no vignette. Worn dark
      volcanic stone paving slabs of a bridge deck: long rectangular basalt
      slabs laid side by side, cracked and heat-scorched, soot streaks, fine
      grey ash packed in the gaps, centres worn smooth by traffic. Photoreal
      game material, fills the entire frame edge to edge, repeating pattern.
    meshy_task_id: 019fe35e-8afc-7c34-abbe-6e6c2bf480b5
    meshy_model: nano-banana-pro
    credits_spent: 9
    resolution: 1024x1024
    license: meshy-paid-full-ownership
    generated_on: 2026-08-08
    notes: >-
      Meshy a servi ce fichier en JPEG sous une extension .png. Godot le
      rejetait en ERR_FILE_CORRUPT sans dire pourquoi. Reconverti en PNG avant
      import ; le tool distingue désormais « introuvable » d'« illisible ».
    derived_maps:
      - res://assets/level02/textures/forge_deck_normal.png
      - res://assets/level02/textures/forge_deck_rough.png

  - name: forge-lever
    path: res://assets/level02/meshes/forge_lever.res
    type: geo
    scene: res://scenes/props/forge_lever.tscn
    material: res://assets/level02/materials/forge_lever.tres
    used_by:
      - res://scripts/world/forge_lever.gd
    prompt: >-
      A heavy volcanic forge lever: a squat pedestal of rough near-black basalt
      blocks, with a long blackened wrought-iron handle angled back on a thick
      pivot bracket. The iron is hammered and pitted, heat-scaled, with faint
      ember-orange glow deep inside the cracks of the stone base. Weathered,
      industrial, ancient. Single object, standing upright, dark volcanic
      palette.
    texture_prompt: >-
      Near-black volcanic basalt pedestal with deep recessed joints and grey ash
      in the crevices; blackened hammered wrought iron handle with heat scale
      and pitting; faint ember-orange glow deep inside the stone cracks only.
      Dark, sooty, no bright colours.
    meshy_task_id: 019fe3cd-cd65-7140-8f49-697fcf30d565   # aperçu
    meshy_refine_task_id: 019fe3cf-1925-72f3-bcba-518623df9f69
    meshy_remesh_task_id: 019fe3e1-21c7-75b0-bf03-4c4a2e7f58a2
    meshy_model: meshy-6
    credits_spent: 35   # 20 génération + 10 texturage + 5 remesh
    triangles: 3034
    license: meshy-paid-full-ownership
    generated_on: 2026-08-09
    notes: >-
      Le remesh n'est pas optionnel : la génération brute pesait 28 Mo. Après
      remesh et réduction des textures, le maillage fait 87 Ko. Le `.glb` source
      n'est pas versionné (cf .gitignore), il se retélécharge depuis les
      task_id ci-dessus.

      Le maillage bascule d'un seul bloc, socle compris — une génération ne
      sépare pas ses pièces, et découper la manette donnerait une coupe fausse.
      D'où une bascule de quinze degrés seulement, qui se lit comme un mécanisme
      qui joue dans son logement.

# --- Généré mais NON embarqué ------------------------------------------------
# Consigné pour que les crédits dépensés restent traçables, et pour qu'on ne
# regénère pas la même chose en croyant qu'elle manque.
rejected:
  - name: forge-iron
    meshy_task_id: 019fe35e-a59b-7bce-9e68-64f939147e4b
    meshy_model: nano-banana-pro
    credits_spent: 9
    generated_on: 2026-08-08
    reason: >-
      Deux motifs. La matière rendue est trop claire pour une palette bâtie sur
      du basalte quasi noir, et sa rouille orange empiète sur un registre
      réservé aux télégraphes de danger. Surtout, elle était destinée aux
      câbles du pont, qui font 16 cm de section : une texture 1024² y serait
      invisible. Les câbles gardent une teinte plate.

credits_total: 62   # dont 9 non embarqués
